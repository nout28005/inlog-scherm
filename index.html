<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inloggen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
      background: white;
    }

    .login-box {
      width: 90%;
      max-width: 380px;

      padding: 35px;

      background: white;
      border: 1px solid #ddd;
      border-radius: 15px;

      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);

      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;

      border: 1px solid #ccc;
      border-radius: 8px;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;

      border: none;
      border-radius: 8px;

      background: #667eea;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #5568d9;
    }

    #melding {
      min-height: 22px;
      margin-top: 15px;
      font-size: 14px;
    }

    #tekstvertalingenKnop {
      display: none;
      margin-top: 12px;
    }

    .site-knop {
      display: block;
      width: 100%;
      padding: 13px;

      border-radius: 8px;

      background: #667eea;
      color: white;

      text-decoration: none;

      font-size: 16px;
      font-weight: bold;
    }

    .site-knop:hover {
      background: #5568d9;
    }

    .succes {
      color: #188038;
    }

    .fout {
      color: #d93025;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Inloggen</h1>

    <p class="subtitle">
      Vul je gegevens in om verder te gaan
    </p>

    <input
      type="text"
      id="gebruikersnaam"
      placeholder="Gebruikersnaam"
      autocomplete="username"
    >

    <input
      type="password"
      id="wachtwoord"
      placeholder="Wachtwoord"
      autocomplete="current-password"
    >

    <button onclick="inloggen()">
      Inloggen
    </button>

    <p id="melding"></p>


    <!-- TEKSTVERTALINGEN -->

    <div id="tekstvertalingenKnop">

      <a
        class="site-knop"
        href="https://sites.google.com/view/klassieke-talen-tvt/startpagina"
      >
        Tekstvertalingen
      </a>

    </div>

  </div>


  <script>

    function inloggen() {

      const gebruikersnaam =
        document.getElementById("gebruikersnaam").value;

      const wachtwoord =
        document.getElementById("wachtwoord").value;


      const juisteGebruikersnaam =
        "ncos.tabor";

      const juisteWachtwoord =
        "W3lKom33!";


      const melding =
        document.getElementById("melding");

      const tekstvertalingenKnop =
        document.getElementById("tekstvertalingenKnop");


      if (
        gebruikersnaam === juisteGebruikersnaam &&
        wachtwoord === juisteWachtwoord
      ) {

        melding.textContent =
          "Inloggen gelukt!";

        melding.className =
          "succes";

        tekstvertalingenKnop.style.display =
          "block";

      } else {

        melding.textContent =
          "Onjuiste gebruikersnaam of wachtwoord.";

        melding.className =
          "fout";

        tekstvertalingenKnop.style.display =
          "none";
      }

    }

  </script>

</body>
</html>
